<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Vitrola Restaurante — Cardápio</title>
  <style>
    :root {
      --bg: #f1e4d3;
      --card: #fff9f1;
      --ink: #2b1d17;
      --mut: #7a6455;
      --br: #5a3a2e;
      --onbr: #fff;
      --ac: #b07a4a;
      --line: #dcc7ad;
      --err: #b3261e;
      --green: #1faa59;
      --shadow: rgba(43,29,23,.12);
    }

    * { box-sizing: border-box; }
    html { scroll-padding-top: 120px; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font: 16px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      padding-bottom: 90px;
    }
    header {
      text-align: center;
      padding: 22px 16px 12px;
    }
    h1 {
      margin: 0;
      font: 800 34px/1 Georgia, "Times New Roman", serif;
      letter-spacing: 1px;
      color: var(--br);
    }
    header p {
      margin: 6px 0 0;
      color: var(--mut);
      font-size: 14px;
    }
    .sticky {
      position: sticky;
      top: 0;
      background: var(--bg);
      z-index: 5;
      padding: 8px 12px 6px;
      border-bottom: 1px solid var(--line);
      box-shadow: 0 2px 8px rgba(0,0,0,.02);
    }
    #q {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: var(--card);
      color: var(--ink);
      font-size: 16px;
    }
    .tabs {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding: 10px 0 2px;
      scrollbar-width: none;
    }
    .tabs button {
      flex: none;
      border: 1px solid var(--line);
      background: var(--card);
      color: var(--ink);
      padding: 8px 14px;
      border-radius: 999px;
      font-size: 14px;
      cursor: pointer;
      font-weight: 700;
    }
    .tabs button.active {
      background: var(--br);
      color: var(--onbr);
    }
    main {
      max-width: 720px;
      margin: 0 auto;
      padding: 0 12px;
    }
    h2 {
      margin: 24px 4px 10px;
      color: var(--br);
      font: 700 20px Georgia, serif;
      border-bottom: 2px solid var(--ac);
      padding-bottom: 4px;
    }
    .it {
      display: flex;
      gap: 12px;
      align-items: center;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 10px;
      margin-bottom: 10px;
      box-shadow: 0 2px 8px var(--shadow);
    }
    .th {
      flex: none;
      width: 64px;
      height: 64px;
      border-radius: 10px;
      background: linear-gradient(135deg, #eadbc5, #d8c4a1);
      display: grid;
      place-items: center;
      font-size: 28px;
      overflow: hidden;
      user-select: none;
    }
    .inf {
      flex: 1;
      min-width: 0;
    }
    .inf b {
      display: block;
      font-size: 15px;
    }
    .inf small {
      color: var(--mut);
      display: block;
      font-size: 12px;
    }
    .pr {
      color: var(--br);
      font-weight: 700;
      margin-top: 2px;
      font-size: 15px;
    }
    .add, .st button, .zap {
      border: 0;
      background: var(--br);
      color: var(--onbr);
      border-radius: 10px;
      font-weight: 700;
      cursor: pointer;
    }
    .add {
      padding: 10px 14px;
      min-height: 44px;
    }
    .st {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .st button {
      width: 40px;
      height: 40px;
      font-size: 20px;
    }
    .st span {
      min-width: 18px;
      text-align: center;
      font-weight: 700;
      font-size: 15px;
    }
    .bar {
      position: fixed;
      left: 12px;
      right: 12px;
      bottom: calc(12px + env(safe-area-inset-bottom, 0px));
      max-width: 696px;
      margin: auto;
      display: none;
      justify-content: space-between;
      align-items: center;
      background: var(--br);
      color: var(--onbr);
      border-radius: 16px;
      padding: 12px 16px;
      z-index: 20;
      box-shadow: 0 10px 28px rgba(0,0,0,.2);
    }
    .bar.on { display: flex; }
    #bn, #bt { font-weight: 800; }
    #ov {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, .55);
      display: none;
      z-index: 10;
      align-items: flex-end;
      justify-content: center;
    }
    #ov.on { display: flex; }
    .sh {
      background: var(--bg);
      width: 100%;
      max-width: 720px;
      max-height: 92%;
      overflow: auto;
      border-radius: 18px 18px 0 0;
      padding: 16px 16px calc(20px + env(safe-area-inset-bottom, 0px));
    }
    .sh h3 {
      margin: 0 0 8px;
      font: 700 22px Georgia, serif;
      color: var(--br);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .sh h3 button {
      border: 0;
      background: none;
      color: var(--ink);
      font-size: 26px;
      cursor: pointer;
    }
    .ln {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      padding: 8px 0;
      border-bottom: 1px solid var(--line);
    }
    label {
      display: block;
      margin: 12px 0 4px;
      font-weight: 600;
      font-size: 14px;
    }
    input[type=text], textarea {
      width: 100%;
      padding: 12px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: var(--card);
      color: var(--ink);
      font: inherit;
    }
    .opts {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
    .opts label {
      margin: 0;
      flex: 1;
      min-width: 100px;
      border: 1px solid var(--line);
      background: var(--card);
      border-radius: 10px;
      padding: 12px;
      text-align: center;
      cursor: pointer;
      font-weight: 600;
    }
    .opts input { display: none; }
    .opts input:checked + span {
      color: var(--br);
      text-decoration: underline;
    }
    .opts label:has(input:checked) {
      border: 2px solid var(--br);
    }
    .g2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }
    .tot {
      display: flex;
      justify-content: space-between;
      font-size: 18px;
      font-weight: 800;
      margin: 14px 0;
      color: var(--br);
    }
    .err {
      color: var(--err);
      font-size: 14px;
      margin-top: 8px;
      min-height: 18px;
    }
    .zap {
      width: 100%;
      padding: 16px;
      border: 0;
      border-radius: 12px;
      background: var(--green);
      color: #fff;
      font-size: 17px;
      font-weight: 800;
      cursor: pointer;
    }
    .hid { display: none; }
    .note { color: var(--mut); font-size: 13px; }
  </style>
</head>
<body>
  <header>
    <h1>VITROLA</h1>
    <p>Restaurante · Aberto todos os dias, 24 horas<br>Av. Cesar Lattes, 1655 · Vila Boa, Goiânia-GO</p>
  </header>

  <div class="sticky">
    <input id="q" type="search" placeholder="Buscar no cardápio…" aria-label="Buscar no cardápio">
    <nav class="tabs" id="tabs"></nav>
  </div>

  <main id="menu"></main>

  <button class="bar" id="bar">
    <span id="bn">0 itens</span>
    <span id="bt">R$ 0,00</span>
  </button>

  <div id="ov">
    <div class="sh" id="sh"></div>
  </div>

  <script>
    const CFG = {
      whatsapp: '556236245612',
      pix: '',
      taxa: 0
    };

    const MENU = {
      Petiscos: [
        ['Asinha Recheada', '8 unidades', 50],
        ['Frango à Passarinho', '1 kg · ~40 min de preparo', 50],
        ['Filé de Tilápia', '450 g', 52],
        ['Costela de Caranha', '450 g', 48],
        ['Isca de Frango', '450 g', 38],
        ['Kibe com Queijo', '8 unidades', 48],
        ['Bolinho de Bacalhau', '8 unidades', 42]
      ],
      Churrasco: [
        ['Picanha', 'Arroz e salada · 800 g', 160],
        ['Filé Mignon', 'Arroz e salada · 800 g', 140],
        ['Peito de Frango', 'Arroz e salada · 800 g', 120],
        ['Meia Chapa', '400 g de carne', 95],
        ['Linguiça', 'Arroz e salada', 60],
        ['Contrafilé', 'Arroz e salada · 800 g', 150]
      ],
      'Porções Pequenas': [
        ['Bife Acebolado', 'Arroz, feijão, bife acebolado e salada', 56],
        ['Costelinha de Porco', 'Arroz, feijão, costelinha e salada', 56],
        ['Tilápia Grelhada', 'Arroz, feijão, tilápia e salada', 54],
        ['Frango Grelhado', 'Arroz, feijão e salada', 50],
        ['Batata Frita', 'Grande', 28]
      ],
      'Porções Médias': [
        ['Bife Acebolado', 'Arroz, feijão, bife acebolado e salada', 84],
        ['Costelinha de Porco', 'Arroz, feijão, costelinha e salada', 84],
        ['Tilápia Grelhada', 'Arroz, feijão, tilápia e salada', 82],
        ['Frango Grelhado', 'Arroz, feijão e salada', 76]
      ],
      'Porções Grandes': [
        ['Bife Acebolado', 'Arroz, feijão, bife acebolado e salada', 140],
        ['Costelinha de Porco', 'Arroz, feijão, costelinha e salada', 140],
        ['Tilápia Grelhada', 'Arroz, feijão, tilápia e salada', 132],
        ['Frango Grelhado', 'Arroz, feijão e salada', 120]
      ],
      'Pratos Executivos': [
        ['Bife Acebolado', 'Arroz, feijão, salada e molho', 35],
        ['Costelinha de Porco', 'Arroz, feijão e salada', 35],
        ['Tilápia Grelhada', 'Arroz, feijão e salada', 38],
        ['Frango Grelhado', 'Arroz, feijão e salada', 32]
      ],
      Marmitex: [
        ['Bife Acebolado', 'Arroz, feijão e bife acebolado', 24],
        ['Costelinha de Porco', 'Arroz, feijão e costelinha', 24],
        ['Tilápia Grelhada', 'Arroz, feijão e tilápia', 28],
        ['Frango Grelhado', 'Arroz, feijão e frango', 26]
      ],
      Caldos: [
        ['Caldo de Frango', 'Acompanha cebolinha e torrada', 25],
        ['Caldo de Feijão', 'Acompanha cebolinha e torrada', 25],
        ['Caldo Vaca Atolada', 'Acompanha cebolinha e torrada', 25],
        ['Caldo Misto', 'Acompanha cebolinha e torrada', 30]
      ],
      Guarnições: [
        ['Arroz Pequeno', '3 conchas', 14],
        ['Arroz Médio', '4 conchas', 17],
        ['Arroz Grande', '6 conchas', 28],
        ['Feijão Pequeno', '250 ml', 9],
        ['Feijão Médio', '350 ml', 12],
        ['Feijão Grande', '450 ml', 17],
        ['Bife Acebolado', 'Porção extra', 20]
      ],
      Sucos: [
        ['Laranja / Limão 500 ml', '', 14],
        ['Laranja / Limão 1 litro', '', 20],
        ['Caldo de Laranja 500 ml', '', 15],
        ['Caldo de Laranja 1 litro', '', 22],
        ['La Fruit Lata 350 ml', '', 7],
        ['La Fruit 1 litro', '', 12],
        ['Suco Polpa 500 ml', '', 10]
      ],
      Água: [
        ['Água s/ Gás', '500 ml', 4],
        ['Água c/ Gás', '500 ml', 5],
        ['Água Tônica', '350 ml', 8],
        ['Gelo e Limão', '', 0.5],
        ['Preparo Cozumel', '', 8]
      ],
      Refrigerantes: [
        ['Refrigerante Lata', '350 ml', 7],
        ['Refrigerante Lata Zero', '350 ml', 8],
        ['Refrigerante 1 Litro', '', 12],
        ['Refrigerante 1,5 Litro', '', 16],
        ['Refri KS', '290 ml', 6],
        ['Refri 600', '600 ml', 9],
        ['H2O', '500 ml', 8],
        ['Schweppes', '250 ml', 9]
      ],
      Cervejas: [
        ['Cerveja', '350 ml', 7],
        ['Petra Puro Malte', '355 ml', 8],
        ['Sol', '330 ml', 10],
        ['Budweiser', '330 ml', 10],
        ['Heineken', '330 ml', 12],
        ['Heineken 0.0', '330 ml', 12],
        ['Antártica', '300 ml', 6],
        ['Duplo Malte', '350 ml', 7],
        ['Amstel', '350 ml', 9]
      ],
      Destilados: [
        ['Smirnoff Ice', '', 10],
        ['Chopp de Vinho', '500 ml', 17],
        ['Taça de Vinho', 'Vinho tinto suave', 10],
        ['Dose de Vodka', 'Orloff', 9],
        ['Dose de Montilla', '', 8],
        ['Dose de Conhaque', '', 5],
        ['Dose de Whisky Red', 'Johnnie Walker', 12]
      ],
      Drinks: [
        ['Cozumel', 'Cerveja, limão, sal e gelo', 15],
        ['Caipirinha', 'Essa todo mundo conhece', 10],
        ['Caipiroska', 'Com vodka', 15],
        ['Cuba Libre', 'Montilla e Coca-Cola', 12],
        ['Soda Italiana', 'Vários sabores', 12],
        ['Gin Tônica', 'Com limão', 18]
      ]
    };

    const icons = {
      Petiscos: '🍽️',
      Churrasco: '🥩',
      'Porções Pequenas': '🍲',
      'Porções Médias': '🍲',
      'Porções Grandes': '🍲',
      'Pratos Executivos': '🥗',
      Marmitex: '📦',
      Caldos: '🍲',
      Guarnições: '🥔',
      Sucos: '🥤',
      Água: '💧',
      Refrigerantes: '🥤',
      Cervejas: '🍺',
      Destilados: '🥃',
      Drinks: '🍸'
    };

    const state = { active: Object.keys(MENU)[0], q: '', cart: {} };

    const q = document.getElementById('q');
    const tabs = document.getElementById('tabs');
    const menu = document.getElementById('menu');
    const bar = document.getElementById('bar');
    const bn = document.getElementById('bn');
    const bt = document.getElementById('bt');
    const ov = document.getElementById('ov');
    const sh = document.getElementById('sh');

    function money(value) {
      return Number(value || 0).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
    }

    function totalItems() {
      return Object.values(state.cart).reduce((sum, qty) => sum + qty, 0);
    }

    function totalPrice() {
      return Object.entries(state.cart).reduce((sum, [id, qty]) => {
        const item = findItemById(id);
        return sum + (item ? item.price * qty : 0);
      }, 0);
    }

    function findItemById(id) {
      for (const category of Object.keys(MENU)) {
        const items = MENU[category];
        for (let i = 0; i < items.length; i++) {
          const item = items[i];
          const key = `${category}::${item[0]}::${item[1]}::${item[2]}`;
          if (key === id) return { category, name: item[0], desc: item[1], price: Number(item[2]) };
        }
      }
      return null;
    }

    function makeId(category, item) {
      return `${category}::${item[0]}::${item[1]}::${item[2]}`;
    }

    function renderTabs() {
      tabs.innerHTML = '';
      Object.keys(MENU).forEach((cat) => {
        const btn = document.createElement('button');
        btn.textContent = cat;
        if (cat === state.active) btn.classList.add('active');
        btn.addEventListener('click', () => {
          state.active = cat;
          render();
        });
        tabs.appendChild(btn);
      });
    }

    function renderMenu() {
      const active = state.active;
      const items = MENU[active].filter(([name, desc]) => {
        const haystack = `${name} ${desc}`.toLowerCase();
        return haystack.includes(state.q.toLowerCase());
      });

      if (!items.length) {
        menu.innerHTML = '<p class="note">Nenhum item encontrado para sua busca.</p>';
        return;
      }

      menu.innerHTML = '<h2>' + active + '</h2>' + items.map(([name, desc, price]) => {
        const id = makeId(active, [name, desc, price]);
        const qty = state.cart[id] || 0;
        return `
          <article class="it">
            <div class="th">${icons[active] || '🍽️'}</div>
            <div class="inf">
              <b>${name}</b>
              ${desc ? '<small>' + desc + '</small>' : ''}
              <div class="pr">${money(price)}</div>
            </div>
            <div class="st">
              <button type="button" data-action="minus" data-id="${id}" aria-label="Diminuir ${name}">−</button>
              <span>${qty}</span>
              <button type="button" data-action="plus" data-id="${id}" aria-label="Adicionar ${name}">+</button>
            </div>
          </article>
        `;
      }).join('');

      menu.querySelectorAll('[data-action="plus"]').forEach(btn => {
        btn.addEventListener('click', () => {
          const id = btn.dataset.id;
          state.cart[id] = (state.cart[id] || 0) + 1;
          render();
        });
      });

      menu.querySelectorAll('[data-action="minus"]').forEach(btn => {
        btn.addEventListener('click', () => {
          const id = btn.dataset.id;
          if (!state.cart[id]) return;
          state.cart[id] -= 1;
          if (state.cart[id] <= 0) delete state.cart[id];
          render();
        });
      });
    }

    function renderBar() {
      const count = totalItems();
      const total = totalPrice();
      if (count > 0) {
        bar.classList.add('on');
        bn.textContent = `${count} ${count === 1 ? 'item' : 'itens'}`;
        bt.textContent = money(total + CFG.taxa);
      } else {
        bar.classList.remove('on');
      }
    }

    function renderOrderSheet() {
      const entries = Object.entries(state.cart);
      if (!entries.length) {
        sh.innerHTML = '<h3>Seu pedido <button type="button" aria-label="Fechar">×</button></h3><p class="note">Adicione alguns itens para continuar.</p>';
        return;
      }

      const rows = entries.map(([id, qty]) => {
        const item = findItemById(id);
        if (!item) return '';
        return `
          <div class="ln">
            <span>${item.name} x${qty}</span>
            <strong>${money(item.price * qty)}</strong>
          </div>
        `;
      }).join('');

      const subtotal = totalPrice();
      const total = subtotal + CFG.taxa;

      sh.innerHTML = `
        <h3>
          <span>Seu pedido</span>
          <button type="button" aria-label="Fechar">×</button>
        </h3>
        ${rows}
        <div class="tot"><span>Subtotal</span><span>${money(subtotal)}</span></div>
        <div class="tot"><span>Taxa</span><span>${money(CFG.taxa)}</span></div>
        <div class="tot"><span>Total</span><span>${money(total)}</span></div>

        <label for="name">Nome</label>
        <input id="name" type="text" placeholder="Seu nome">

        <label for="phone">Telefone/WhatsApp</label>
        <input id="phone" type="text" placeholder="(99) 99999-9999">

        <label for="address">Endereço (se necessário)</label>
        <textarea id="address" rows="3" placeholder="Rua, número, bairro, complemento"></textarea>

        <label>Pagamento</label>
        <div class="opts">
          <label><input type="radio" name="pay" value="Pix" checked><span>Pix</span></label>
          <label><input type="radio" name="pay" value="Dinheiro"><span>Dinheiro</span></label>
          <label><input type="radio" name="pay" value="Cartão"><span>Cartão</span></label>
        </div>

        <div id="err" class="err"></div>
        <button type="button" class="zap" id="sendorder">Enviar pedido no WhatsApp</button>
      `;

      sh.querySelector('button[aria-label="Fechar"]').addEventListener('click', closeOrder);
      sh.querySelector('#sendorder').addEventListener('click', () => {
        // avoid optional chaining for compatibility with older preview environments
        const nameEl = document.getElementById('name');
        const phoneEl = document.getElementById('phone');
        const addressEl = document.getElementById('address');
        const payEl = document.querySelector('input[name="pay"]:checked');
        const name = nameEl && nameEl.value ? nameEl.value.trim() : '';
        const phone = phoneEl && phoneEl.value ? phoneEl.value.trim() : '';
        const address = addressEl && addressEl.value ? addressEl.value.trim() : '';
        const pay = payEl && payEl.value ? payEl.value : 'Pix';
        const err = document.getElementById('err');

        if (!name || !phone) {
          err.textContent = 'Preencha nome e telefone para continuar.';
          return;
        }

        const text = [
          'Olá, Vitrola! Gostaria de fazer o seguinte pedido:',
          ...entries.map(([id, qty]) => {
            const item = findItemById(id);
            return '- ' + (item ? item.name : id) + ': ' + qty + 'x';
          }),
          '',
          'Nome: ' + name,
          'Telefone: ' + phone,
          'Pagamento: ' + pay,
          'Endereço: ' + (address || 'Não informado'),
          'Total: ' + money(total)
        ].join('\n');

        const url = 'https://wa.me/' + CFG.whatsapp + '?text=' + encodeURIComponent(text);
        window.open(url, '_blank');
      });
    }

    function openOrder() {
      renderOrderSheet();
      ov.classList.add('on');
    }

    function closeOrder() {
      ov.classList.remove('on');
    }

    q.addEventListener('input', (e) => {
      state.q = e.target.value;
      render();
    });

    bar.addEventListener('click', openOrder);
    ov.addEventListener('click', (e) => {
      if (e.target === ov) closeOrder();
    });

    function render() {
      renderTabs();
      renderMenu();
      renderBar();
    }

    render();
  </script>
</body>
</html>
